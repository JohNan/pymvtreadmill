[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymvtreadmill"
version = "0.1.0"
description = "Modern Async driver for Mobvoi/Horizon treadmills (Python 3.13+)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Jules", email = "jules@example.com"}]
dependencies = [
    "bleak>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "black>=24.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pymvtreadmill"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

[tool.black]
line-length = 100
target-version = ['py313']
